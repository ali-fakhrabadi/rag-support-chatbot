  <div class="top"><div class="brand"><i>A</i>ALI F. <span>Secure RAG Knowledge Assistant</span></div>
    <div class="kind mono"><i></i>Architecture</div></div>
  <h1>From uploaded file to cited answer</h1>
  <p class="sub">Two paths share one PostgreSQL database. Every step runs inside the caller's workspace.</p>
</div>

  <g class="n"><rect x="80" y="350" width="200" height="130" rx="14"/><text class="nt" x="100" y="392">Upload</text><text class="ns" x="100" y="424">admin only,</text><text class="ns" x="100" y="450">PDF · TXT · MD</text></g>
  <g class="n"><rect x="332" y="350" width="200" height="130" rx="14"/><text class="nt" x="352" y="392">Validate</text><text class="ns" x="352" y="424">type, size,</text><text class="ns" x="352" y="450">file signature</text></g>
