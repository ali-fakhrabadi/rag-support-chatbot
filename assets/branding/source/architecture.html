<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Architecture</title>
<link rel="stylesheet" href="base.css">
<style>
  html, body { width: {{width}}px; height: {{height}}px; }
  .wrap { position: absolute; inset: 0; padding: 64px 80px 0; }
  h1 { margin-top: 34px; font-size: 54px; font-weight: 800; letter-spacing: -.03em; }
  .sub { margin-top: 10px; font-size: 24px; color: var(--muted); }
  svg { position: absolute; left: 0; top: 0; }
  .box rect { fill: rgba(22, 27, 34, .97); stroke: #30363d; stroke-width: 2; }
  .box.g rect { stroke: #2ea043; } .box.c rect { stroke: #38bdf8; } .box.t rect { stroke: #2dd4bf; }
  .zone { fill: none; stroke: #30363d; stroke-width: 2; stroke-dasharray: 8 8; }
  .zl { fill: #6e7681; font: 600 18px "JetBrains Mono"; letter-spacing: .08em; }
  .bt { fill: #fff; font: 700 26px "Inter"; }
  .bs { fill: #9da7b3; font: 400 19px "Inter"; }
  .arrow { stroke: #6e7681; stroke-width: 3; fill: none; marker-end: url(#a); }
  .al { fill: #9da7b3; font: 400 17px "JetBrains Mono"; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="wrap">
  <div class="top"><div class="brand"><i>A</i>ALI F. <span>Secure RAG Knowledge Assistant</span></div>
    <div class="kind mono"><i></i>Architecture</div></div>
  <h1>Docker Compose, one host, models over HTTP</h1>
  <p class="sub">Data services have no published ports. Every container runs as non-root with a read-only filesystem.</p>
</div>
<svg width="{{width}}" height="{{height}}" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid meet">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker></defs>
  <rect class="zone" x="330" y="330" width="1240" height="420" rx="18"/><text class="zl" x="350" y="362">egress network</text>
  <rect class="zone" x="330" y="790" width="760" height="330" rx="18"/><text class="zl" x="350" y="822">data network (internal)</text>
  <rect class="zone" x="1130" y="790" width="440" height="330" rx="18"/><text class="zl" x="1150" y="822">model host(s)</text>

  <g class="box"><rect x="40" y="470" width="250" height="140" rx="16"/><text class="bt" x="66" y="530">Browser</text><text class="bs" x="66" y="565">React + TypeScript</text></g>
  <g class="box t"><rect x="370" y="400" width="300" height="160" rx="16"/><text class="bt" x="396" y="456">web · nginx</text><text class="bs" x="396" y="490">SPA, strict CSP</text><text class="bs" x="396" y="520">/api proxy</text></g>
  <g class="box g"><rect x="760" y="400" width="340" height="160" rx="16"/><text class="bt" x="786" y="456">api · FastAPI</text><text class="bs" x="786" y="490">auth, RBAC, retrieval,</text><text class="bs" x="786" y="520">grounded answers</text></g>
  <g class="box g"><rect x="760" y="590" width="340" height="140" rx="16"/><text class="bt" x="786" y="646">worker · Celery</text><text class="bs" x="786" y="680">extract, chunk, embed</text></g>
  <g class="box c"><rect x="370" y="860" width="380" height="220" rx="16"/><text class="bt" x="396" y="916">PostgreSQL 17</text><text class="bs" x="396" y="950">pgvector HNSW + full-text</text><text class="bs" x="396" y="980">forced row-level security</text><text class="bs" x="396" y="1010">audit log (append-only)</text></g>
  <g class="box c"><rect x="790" y="860" width="260" height="220" rx="16"/><text class="bt" x="816" y="916">Redis</text><text class="bs" x="816" y="950">job queue</text><text class="bs" x="816" y="980">rate limits</text></g>
  <g class="box"><rect x="1170" y="860" width="360" height="100" rx="16"/><text class="bt" x="1196" y="904">Ollama</text><text class="bs" x="1196" y="936">nomic-embed-text</text></g>
  <g class="box"><rect x="1170" y="980" width="360" height="110" rx="16"/><text class="bt" x="1196" y="1024">Ollama or OpenAI</text><text class="bs" x="1196" y="1058">llama3.1 8B (default)</text></g>

  <path class="arrow" d="M290 540 L366 500"/><text class="al" x="292" y="500">HTTPS</text>
  <path class="arrow" d="M670 480 L756 480"/>
  <path class="arrow" d="M930 560 L930 586"/><text class="al" x="944" y="580">enqueue</text>
  <path class="arrow" d="M840 730 L640 856"/>
  <path class="arrow" d="M900 730 L900 856"/>
  <path class="arrow" d="M1100 470 L1300 470 L1300 856"/><text class="al" x="1120" y="455">query embedding</text>
  <path class="arrow" d="M1100 520 L1250 520 L1250 976"/><text class="al" x="1110" y="545">answer (JSON)</text>
  <path class="arrow" d="M1100 690 L1210 690 L1210 856"/><text class="al" x="1110" y="715">passages</text>
</svg>
</body>
</html>
